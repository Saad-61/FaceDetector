<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Detector</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ── UPLOAD VIEW ──────────────────────────────────────── -->
  <div id="view-upload" class="view">
    <div class="upload-wrap">

      <div class="app-header">
        <span class="app-icon">◈</span>
        <h1 class="app-title">Face Detector</h1>
      </div>
      <p class="app-sub">Drop an image to detect every face in it</p>

      <div id="drop-zone" class="drop-zone" role="button" tabindex="0">
        <input type="file" id="file-input" accept="image/*" hidden />

        <div class="dz-inner" id="dz-idle">
          <div class="dz-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <p class="dz-title">Drop image here</p>
          <p class="dz-hint">or <span class="dz-link">click to browse</span></p>
          <p class="dz-formats">JPG · PNG · WEBP · BMP</p>
        </div>

        <div class="dz-inner dz-over-inner hidden" id="dz-over">
          <p class="dz-title">Release to detect →</p>
        </div>
      </div>

    </div>
  </div>

  <!-- ── LOADING VIEW ─────────────────────────────────────── -->
  <div id="view-loading" class="view hidden">
    <div class="loading-wrap">
      <div class="ring"></div>
      <p id="loading-label" class="loading-label">Detecting faces…</p>
      <p class="loading-sub">Large images may take a few seconds</p>
    </div>
  </div>

  <!-- ── RESULTS VIEW ─────────────────────────────────────── -->
  <div id="view-results" class="view hidden">

    <!-- Top bar -->
    <div class="results-bar">
      <div class="results-bar-left">
        <span id="res-count" class="res-count"></span>
        <span id="res-time"  class="res-time"></span>
      </div>
      <button id="btn-new" class="btn-new">↩ New image</button>
    </div>

    <!-- Body: image + face list -->
    <div class="results-body">

      <!-- Left: annotated image -->
      <div class="results-img-wrap">
        <img id="result-img" alt="Result" />
      </div>

      <!-- Right: face list -->
      <div class="results-sidebar">
        <div class="sidebar-title">Faces <span id="sidebar-count" class="sidebar-count"></span></div>
        <div id="face-list" class="face-list"></div>
      </div>

    </div>
  </div>

  <!-- ── ERROR TOAST ──────────────────────────────────────── -->
  <div id="error-toast" class="error-toast hidden">
    <span id="error-text"></span>
    <button id="error-dismiss">✕</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
