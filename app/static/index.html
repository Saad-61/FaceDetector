<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Detector</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230f111a%22/%3E%3Crect%20x%3D%220.5%22%20y%3D%220.5%22%20width%3D%2263%22%20height%3D%2263%22%20rx%3D%2213.5%22%20stroke%3D%22%23323750%22%20stroke-width%3D%221%22/%3E%3Cpath%20d%3D%22M12%2022%20V%2015%20A%203%203%200%200%201%2015%2012%20H%2022%22%20stroke%3D%22%236366f1%22%20stroke-width%3D%223.5%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M42%2012%20H%2049%20A%203%203%200%200%201%2052%2015%20V%2022%22%20stroke%3D%22%236366f1%22%20stroke-width%3D%223.5%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M12%2042%20V%2049%20A%203%203%200%200%200%2015%2052%20H%2022%22%20stroke%3D%22%236366f1%22%20stroke-width%3D%223.5%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M42%2052%20H%2049%20A%203%203%200%200%200%2052%2049%20V%2042%22%20stroke%3D%22%236366f1%22%20stroke-width%3D%223.5%22%20stroke-linecap%3D%22round%22/%3E%3Cellipse%20cx%3D%2232%22%20cy%3D%2232%22%20rx%3D%2211%22%20ry%3D%2213%22%20stroke%3D%22%23a5b4fc%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%2227.5%22%20cy%3D%2229%22%20r%3D%221.8%22%20fill%3D%22%2338bdf8%22/%3E%3Ccircle%20cx%3D%2236.5%22%20cy%3D%2229%22%20r%3D%221.8%22%20fill%3D%22%2338bdf8%22/%3E%3Cpath%20d%3D%22M28%2036%20Q%2032%2040%2036%2036%22%20stroke%3D%22%2338bdf8%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22/%3E%3C/svg%3E" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=3" />
  <link rel="shortcut icon" href="/favicon.ico?v=3" />
  <link rel="apple-touch-icon" href="/favicon.png?v=3" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ── UPLOAD VIEW ──────────────────────────────────────── -->
  <div id="view-upload" class="view">
    <div class="upload-wrap">

      <div class="app-header">
        <img src="/favicon.svg" alt="Face Detector" class="app-icon" width="28" height="28" />
        <h1 class="app-title">Face Detector</h1>
      </div>
      <p class="app-sub">Drop an image to detect every face in it</p>

      <div id="drop-zone" class="drop-zone" role="button" tabindex="0">
        <input type="file" id="file-input" accept="image/*" hidden />

        <div class="dz-inner" id="dz-idle">
          <div class="dz-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <p class="dz-title">Drop image here</p>
          <p class="dz-hint">or <span class="dz-link">click to browse</span></p>
          <p class="dz-formats">JPG · PNG · WEBP · BMP</p>
        </div>

        <div class="dz-inner dz-over-inner hidden" id="dz-over">
          <p class="dz-title">Release to detect →</p>
        </div>
      </div>

    </div>
  </div>

  <!-- ── LOADING VIEW ─────────────────────────────────────── -->
  <div id="view-loading" class="view hidden">
    <div class="loading-wrap">
      <div class="ring"></div>
      <p id="loading-label" class="loading-label">Detecting faces…</p>
      <p class="loading-sub">Large images may take a few seconds</p>
    </div>
  </div>

  <!-- ── RESULTS VIEW ─────────────────────────────────────── -->
  <div id="view-results" class="view hidden">

    <!-- Top bar -->
    <div class="results-bar">
      <div class="results-bar-left">
        <span id="res-count" class="res-count"></span>
        <span id="res-time"  class="res-time"></span>
      </div>
      <button id="btn-new" class="btn-new">↩ New image</button>
    </div>

    <!-- Body: image + face list -->
    <div class="results-body">

      <!-- Left: annotated image -->
      <div class="results-img-wrap">
        <img id="result-img" alt="Result" />
      </div>

      <!-- Right: face list -->
      <div class="results-sidebar">
        <div class="sidebar-title">Faces <span id="sidebar-count" class="sidebar-count"></span></div>
        <div id="face-list" class="face-list"></div>
      </div>

    </div>
  </div>

  <!-- ── ERROR TOAST ──────────────────────────────────────── -->
  <div id="error-toast" class="error-toast hidden">
    <span id="error-text"></span>
    <button id="error-dismiss">✕</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
